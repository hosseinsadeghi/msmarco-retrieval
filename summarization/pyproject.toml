[project]
name = "summarization"
version = "0.1.0"
description = "Small-model summarization benchmark on LongBench subsets, scored with ROUGE-L and BERTScore, rendered to HTML."
readme = "README.md"
authors = [
    { name = "Hossein Sadeghi", email = "hse1984@gmail.com" }
]
requires-python = ">=3.10,<3.13"

dependencies = [
    "torch>=2.0",
    "torchvision>=0.18",       # required by Qwen3.5's multimodal processor stack
    # transformers 5.x is required for the Qwen3.5 family (model_type=qwen3_5);
    # 4.57 is the last 4.x and does not register that architecture. Older
    # subprojects in this repo still pin to <5 because they hit unrelated 5.x
    # internal-layout changes — summarization/ is independent so it can move.
    "transformers>=5.6",
    "accelerate>=0.30",
    "datasets>=3.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "sentencepiece>=0.2",
    "protobuf>=4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
