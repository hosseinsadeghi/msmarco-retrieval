[project]
name = "retrieval"
version = "0.1.0"
description = "BM25 / dense / hybrid retrieval over MS MARCO QA passages"
readme = "README.md"
authors = [
    { name = "Hossein Sadeghi", email = "hse1984@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=3.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=4.0",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11",
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
